
services:
  api:
    build: .
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 5s
      timeout: 3s
      retries: 12

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    depends_on:
      api:
        condition: service_healthy
    environment:
      ZAP_AUTH_HEADER: Authorization
      ZAP_AUTH_HEADER_VALUE: "Bearer alice-demo-token"
      ZAP_AUTH_HEADER_SITE: api
    volumes:
      - ./reports/zap:/zap/wrk:rw
    command:
      - zap-api-scan.py
      - -t
      - http://api:8000/openapi.json
      - -f
      - openapi
      - -r
      - api-scan.html
      - -J
      - api-scan.json
